<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>لوحة الإدارة — مدرسة الشهيد أحمد محمد المدبق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark:  #12306b;
  --green-mid:   #1a3f8a;
  --green-main:  #c8102e;
  --green-light: #e0233f;
  --green-pale:  #fbf3e0;
  --navy:        #0b1b3f;
  --navy-mid:    #12285c;
  --white:       #FFFFFF;
  --gray-bg:     #f8f3e6;
  --gray-line:   #e8e0cc;
  --text-dark:   #1b2033;
  --text-mid:    #5b6275;
  --gold:        #C9A84C;
  --gold-light:  #E2C170;
  --shadow-sm:   rgba(18,48,107,0.10);
  --shadow-md:   rgba(18,48,107,0.16);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Cairo', sans-serif; background: var(--white); color: var(--text-dark); overflow-x: hidden; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.3)} }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--gray-bg); }
::-webkit-scrollbar-thumb { background: var(--green-main); border-radius: 3px; }

/* ══════════════════════════════════════════
   GOV BAR  (Egyptian flag strip)
══════════════════════════════════════════ */
.gov-bar {
  background: var(--green-dark);
  color: rgba(255,255,255,0.85);
  font-size: 12px;
  padding: 7px 40px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.gov-bar-right { display: flex; align-items: center; gap: 10px; }
.gov-bar-flag {
  width: 26px; height: 18px;
  background: var(--green-main);
  border-radius: 2px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: white; font-weight: 700; overflow: hidden;
}
.gov-bar-flag img { width: 100%; height: 100%; object-fit: cover; }
.gov-badge-text { font-weight: 600; }
.gov-bar-left { display: flex; align-items: center; gap: 18px; }
.gov-dgi {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: rgba(255,255,255,0.6);
}
.gov-dgi-dot { width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; flex-shrink: 0; }

/* ══════════════════════════════════════════
   UTILITY BAR
══════════════════════════════════════════ */
.util-bar {
  background: var(--white);
  border-bottom: 1px solid var(--gray-line);
  padding: 6px 40px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--text-mid);
}
.util-bar-right { display: flex; align-items: center; gap: 22px; }
.util-item { display: flex; align-items: center; gap: 6px; }
.util-item svg { flex-shrink: 0; }
.util-bar-left { display: flex; align-items: center; gap: 12px; }
.util-lang {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--gray-line); border-radius: 4px; padding: 3px 10px;
  font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text-dark);
  transition: all 0.2s; text-decoration: none;
}
.util-lang:hover { border-color: var(--green-main); color: var(--green-main); }
.util-search-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--green-dark); color: white;
  border: none; border-radius: 4px; padding: 5px 14px;
  font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.util-search-btn:hover { background: var(--green-main); }

/* ══════════════════════════════════════════
   MAIN HEADER / NAV
══════════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 200;
  background: var(--navy);
  border-bottom: 3px solid var(--green-main);
}
.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 78px;
}
.header-logo {
  display: flex; align-items: center; gap: 14px; text-decoration: none;
}
.logo-emblem {
  width: 58px; height: 58px;
  background: linear-gradient(145deg, var(--green-light), var(--green-dark));
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: 'Amiri', serif; font-size: 26px; color: white; font-weight: 700;
  box-shadow: 0 2px 12px rgba(200,16,46,0.5);
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}
.logo-info .logo-name {
  font-size: 18px; font-weight: 900; color: white; line-height: 1.2;
}
.logo-info .logo-sub {
  font-size: 11px; color: rgba(255,255,255,0.45); font-weight: 400; margin-top: 1px;
}

.main-nav { display: flex; list-style: none; gap: 2px; }
.main-nav > li { position: relative; }
.main-nav > li > a {
  display: flex; align-items: center; gap: 5px;
  color: rgba(255,255,255,0.80); text-decoration: none;
  font-size: 13.5px; font-weight: 600; padding: 0 14px; height: 78px;
  transition: all 0.2s; border-bottom: 3px solid transparent; margin-bottom: -3px;
  white-space: nowrap;
}
.main-nav > li > a:hover,
.main-nav > li > a.active {
  color: white; border-bottom-color: var(--green-light);
  background: rgba(255,255,255,0.06);
}
.main-nav > li > a .nav-arrow { font-size: 9px; opacity: 0.5; margin-top: 1px; }

/* ══════════════════════════════════════════
   HERO BANNER  (full-width hero)
══════════════════════════════════════════ */
.hero {
  background: var(--navy);
  position: relative; overflow: hidden;
  min-height: 520px;
  display: flex; align-items: center;
}
.hero-bg-overlay {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 90% at 10% 50%, rgba(200,16,46,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 90% 30%, rgba(18,48,107,0.35) 0%, transparent 60%),
    linear-gradient(135deg, #0b1b3f 0%, #0f2350 50%, #081433 100%);
}
.hero-pattern {
  position: absolute; inset: 0; opacity: 0.025;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,1) 0, rgba(255,255,255,1) 1px, transparent 0, transparent 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,1) 0, rgba(255,255,255,1) 1px, transparent 0, transparent 40px);
}
.hero-accent-circle {
  position: absolute; width: 700px; height: 700px;
  border: 1px solid rgba(200,16,46,0.15); border-radius: 50%;
  top: 50%; right: -10%;
  transform: translateY(-50%);
}
.hero-accent-circle::after {
  content: ''; position: absolute; inset: 60px;
  border: 1px solid rgba(200,16,46,0.08); border-radius: 50%;
}
.hero-content {
  position: relative; z-index: 2;
  max-width: 1280px; margin: 0 auto;
  padding: 80px 40px;
  display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 60px; align-items: center;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(200,16,46,0.2); border: 1px solid rgba(200,16,46,0.4);
  border-radius: 100px; padding: 5px 16px; font-size: 11px; font-weight: 700;
  color: #f2c94c; letter-spacing: 1.5px; margin-bottom: 20px;
  animation: fadeUp 0.7s ease both;
}
.hero-eyebrow::before { content: '✦'; font-size: 9px; }
.hero-title {
  font-family: 'Amiri', serif;
  font-size: clamp(34px, 4.5vw, 60px);
  color: white; line-height: 1.3; margin-bottom: 18px;
  animation: fadeUp 0.7s 0.1s ease both;
}
.hero-title .hl { color: #f2c94c; }
.hero-sub {
  font-size: 15px; color: rgba(255,255,255,0.55); line-height: 1.9;
  margin-bottom: 36px; max-width: 480px;
  animation: fadeUp 0.7s 0.2s ease both;
}
.hero-actions {
  display: flex; gap: 14px; flex-wrap: wrap;
  animation: fadeUp 0.7s 0.3s ease both;
}
.btn-hero-primary {
  background: var(--green-main); color: white;
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14px;
  padding: 13px 28px; border-radius: 6px; border: none; cursor: pointer;
  text-decoration: none; display: inline-block;
  box-shadow: 0 4px 20px rgba(200,16,46,0.4);
  transition: all 0.25s;
}
.btn-hero-primary:hover { background: var(--green-light); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(200,16,46,0.5); }
.btn-hero-outline {
  background: transparent; color: rgba(255,255,255,0.8);
  font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 14px;
  padding: 12px 26px; border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,0.2); cursor: pointer;
  text-decoration: none; display: inline-block;
  transition: all 0.25s;
}
.btn-hero-outline:hover { border-color: rgba(255,255,255,0.5); color: white; background: rgba(255,255,255,0.06); }

/* Stats cards (right side of hero) */
.hero-stats-panel {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  animation: fadeUp 0.7s 0.35s ease both;
}
.stat-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 26px 20px; text-align: center;
  transition: all 0.3s;
}
.stat-box:hover {
  background: rgba(200,16,46,0.12); border-color: rgba(200,16,46,0.4);
  transform: translateY(-3px);
}
.stat-box-icon { font-size: 28px; margin-bottom: 10px; display: block; }
.stat-box-num {
  font-family: 'Amiri', serif; font-size: 40px; font-weight: 700;
  color: #f2c94c; line-height: 1; display: block;
}
.stat-box-label { font-size: 11.5px; color: rgba(255,255,255,0.45); margin-top: 6px; font-weight: 600; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════
   QUICK LINKS BAR  (icon row)
══════════════════════════════════════════ */
.quick-bar {
  background: var(--green-dark);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.quick-bar-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 0 40px;
  display: grid; grid-template-columns: repeat(5,1fr);
}
.quick-item {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 6px; padding: 20px 10px;
  color: rgba(255,255,255,0.75); text-decoration: none;
  font-size: 12px; font-weight: 600; text-align: center;
  border-right: 1px solid rgba(255,255,255,0.07);
  transition: all 0.25s;
}
.quick-item:last-child { border-right: none; }
.quick-item:hover { background: rgba(255,255,255,0.07); color: white; }
.quick-item-icon { font-size: 24px; }

/* ══════════════════════════════════════════
   SECTION SHARED STYLES
══════════════════════════════════════════ */
.section { padding: 80px 40px; }
.section-alt { background: var(--gray-bg); }
.container { max-width: 1280px; margin: 0 auto; }

.sec-label {
  display: inline-block; font-size: 11px; font-weight: 700;
  letter-spacing: 2px; color: var(--green-main);
  border-right: 3px solid var(--green-main); padding-right: 12px;
  margin-bottom: 12px;
}
.sec-title {
  font-family: 'Amiri', serif;
  font-size: clamp(26px, 3.5vw, 40px);
  color: var(--text-dark); line-height: 1.35;
  margin-bottom: 14px;
}
.sec-title.on-dark { color: white; }
.sec-line {
  width: 50px; height: 3px;
  background: var(--green-main);
  border-radius: 2px; margin-bottom: 18px;
}
.sec-desc { font-size: 14.5px; color: var(--text-mid); line-height: 1.9; max-width: 560px; }
.sec-header { margin-bottom: 48px; }
.sec-header.centered { text-align: center; }
.sec-header.centered .sec-line { margin-right: auto; margin-left: auto; }
.sec-header.centered .sec-desc { margin: 0 auto; }
.sec-header.centered .sec-label { border-right: none; border-bottom: 3px solid var(--green-main); padding-right: 0; padding-bottom: 6px; }

/* fade-in on scroll */
.fade-in { opacity: 0; transform: translateY(28px); transition: opacity 0.65s ease, transform 0.65s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* ══════════════════════════════════════════
   NUMBERS SECTION
══════════════════════════════════════════ */
.numbers-section {
  background: var(--green-dark); padding: 60px 40px;
}
.numbers-inner {
  max-width: 1280px; margin: 0 auto;
}
.numbers-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 20px; margin-bottom: 40px;
}
.numbers-header .sec-title { color: white; margin-bottom: 0; }
.numbers-header .sec-label { color: #f2c94c; border-color: #f2c94c; }
.numbers-cards {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 20px;
}
.num-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 32px 22px; text-align: center;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.num-card::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: var(--green-light); transform: scaleX(0); transform-origin: left;
  transition: transform 0.3s;
}
.num-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); transform: translateY(-4px); }
.num-card:hover::after { transform: scaleX(1); transform-origin: right; }
.num-icon { font-size: 30px; margin-bottom: 14px; display: block; }
.num-value {
  font-family: 'Amiri', serif; font-size: 48px; font-weight: 700;
  color: #f2c94c; line-height: 1; display: block;
}
.num-suffix { font-size: 20px; color: rgba(255,255,255,0.5); }
.num-label { font-size: 13px; color: rgba(255,255,255,0.55); font-weight: 600; margin-top: 8px; line-height: 1.5; }

/* ══════════════════════════════════════════
   ABOUT SECTION
══════════════════════════════════════════ */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
.about-visual {
  position: relative; border-radius: 12px; overflow: hidden;
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, var(--green-dark), var(--navy-mid));
  display: flex; align-items: center; justify-content: center;
}
.about-visual-inner { text-align: center; padding: 40px; }
.about-visual-icon { font-size: 90px; display: block; margin-bottom: 16px; }
.about-visual-text { font-family: 'Amiri', serif; font-size: 20px; color: rgba(255,255,255,0.8); }
.about-badge {
  position: absolute; bottom: 20px; right: 20px;
  background: var(--green-main); color: white;
  border-radius: 8px; padding: 14px 20px; font-weight: 700; font-size: 12px;
  box-shadow: 0 6px 20px rgba(200,16,46,0.4);
}
.about-badge span { font-size: 28px; font-family: 'Amiri', serif; display: block; margin-bottom: 4px; }
.values-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
.val-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px; border-radius: 8px;
  background: var(--gray-bg); border: 1px solid var(--gray-line);
  transition: all 0.25s;
}
.val-item:hover { border-color: var(--green-main); background: var(--green-pale); }
.val-icon {
  width: 38px; height: 38px; min-width: 38px;
  background: var(--green-main); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 17px; color: white;
}
.val-name { font-weight: 700; font-size: 13px; color: var(--text-dark); }
.val-desc { font-size: 11px; color: var(--text-mid); margin-top: 2px; }

/* ══════════════════════════════════════════
   PRINCIPAL MESSAGE
══════════════════════════════════════════ */
.principal-section {
  background: var(--navy); padding: 90px 40px; position: relative; overflow: hidden;
}
.principal-section::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 80% at 80% 50%, rgba(200,16,46,0.1) 0%, transparent 60%);
}
.principal-grid {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: 280px 1fr; gap: 60px; align-items: center;
}
.prin-photo-wrap { text-align: center; }
.prin-avatar {
  width: 190px; height: 190px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-mid), var(--navy-mid));
  border: 3px solid var(--green-main);
  margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
  font-size: 65px;
  box-shadow: 0 0 0 8px rgba(200,16,46,0.12);
}
.prin-name { color: #f2c94c; font-weight: 700; font-size: 15px; }
.prin-role { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 4px; }
.prin-quote {
  font-family: 'Amiri', serif;
  font-size: clamp(18px, 2.5vw, 28px);
  color: white; line-height: 1.75; margin-bottom: 22px;
  border-right: 4px solid var(--green-main); padding-right: 24px;
}
.prin-text { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.9; }

/* ══════════════════════════════════════════
   SERVICES / PORTALS
══════════════════════════════════════════ */
.portals-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; margin-top: 48px; }
.portal-card {
  background: var(--white); border: 1px solid var(--gray-line);
  border-radius: 10px; padding: 34px 26px; text-align: center;
  transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden;
}
.portal-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--green-main); transform: scaleX(0); transform-origin: left;
  transition: transform 0.3s;
}
.portal-card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px var(--shadow-md); border-color: var(--green-pale); }
.portal-card:hover::before { transform: scaleX(1); transform-origin: right; }
.p-emoji { font-size: 46px; margin-bottom: 16px; display: block; }
.p-title { font-size: 17px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; }
.p-desc { font-size: 13px; color: var(--text-mid); line-height: 1.75; margin-bottom: 22px; }
.p-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--green-main); font-weight: 700; font-size: 13px;
  text-decoration: none; border-bottom: 1.5px solid var(--green-main);
  padding-bottom: 2px; transition: gap 0.2s;
}
.p-link:hover { gap: 10px; }

/* ══════════════════════════════════════════
   NEWS
══════════════════════════════════════════ */
.news-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: 48px; }
.news-featured {
  background: var(--navy); border-radius: 10px; overflow: hidden;
  position: relative; min-height: 340px;
  display: flex; align-items: flex-end; cursor: pointer;
  transition: transform 0.3s;
}
.news-featured:hover { transform: scale(1.01); }
.nf-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--green-dark), var(--navy));
  display: flex; align-items: center; justify-content: center;
  font-size: 96px; opacity: 0.25;
}
.nf-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(11,27,63,0.95) 0%, transparent 55%);
}
.nf-content { position: relative; z-index: 1; padding: 32px; }
.news-tag {
  background: var(--green-main); color: white;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  padding: 3px 10px; border-radius: 3px; display: inline-block; margin-bottom: 12px;
}
.nf-title { font-size: 20px; font-weight: 700; color: white; line-height: 1.5; margin-bottom: 10px; }
.nf-date { font-size: 12px; color: rgba(255,255,255,0.4); }
.news-list { display: flex; flex-direction: column; gap: 14px; }
.news-item {
  background: var(--white); border: 1px solid var(--gray-line);
  border-radius: 8px; padding: 18px; transition: all 0.3s; cursor: pointer;
  display: flex; gap: 14px; align-items: flex-start;
}
.news-item:hover { border-color: var(--green-main); background: var(--green-pale); }
.ni-icon {
  width: 44px; height: 44px; min-width: 44px;
  background: var(--green-main); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
}
.ni-title { font-size: 13.5px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; line-height: 1.4; }
.ni-date { font-size: 11px; color: var(--text-mid); }

/* ══════════════════════════════════════════
   MANAGEMENT
══════════════════════════════════════════ */
.mgmt-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-top: 48px; }
.mgmt-card {
  text-align: center; padding: 30px 18px;
  border: 1px solid var(--gray-line); border-radius: 10px;
  background: var(--white); transition: all 0.3s;
}
.mgmt-card:hover { border-color: var(--green-main); transform: translateY(-4px); box-shadow: 0 10px 32px var(--shadow-sm); }
.mgmt-avatar {
  width: 86px; height: 86px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-dark), var(--navy-mid));

/* ══════════════════════════════════════════
   ACHIEVEMENTS
══════════════════════════════════════════ */
.achievements-section { background: var(--navy); padding: 90px 40px; }
.ach-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; margin-top: 48px; }
.ach-card {
  background: rgba(255,255,255,0.04);

.ach-card:hover { background: rgba(200,16,46,0.12); border-color: rgba(200,16,46,0.4); transform: translateY(-4px); }
.ach-icon { font-size: 36px; margin-bottom: 16px; display: block; }
.ach-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 10px; }
.ach-desc { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.8; }
.ach-year { font-size: 12px; color: #f2c94c; font-weight: 700; margin-top: 14px; }

/* ══════════════════════════════════════════
   ADMISSION
══════════════════════════════════════════ */
.admission-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
.steps-list { display: flex; flex-direction: column; gap: 16px; }
.step-item {
  display: flex; gap: 18px; align-items: flex-start;
  padding: 20px; background: var(--white);

}
.step-item:hover { border-color: var(--green-main); transform: translateX(5px); }
.step-num {
  width: 38px; height: 38px; min-width: 38px;
  background: var(--green-main); color: white; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 15px; font-family: 'Amiri', serif;
}
.step-title { font-weight: 700; font-size: 13.5px; color: var(--text-dark); margin-bottom: 3px; }
.step-desc { font-size: 12px; color: var(--text-mid); line-height: 1.6; }
.adm-panel {
  background: var(--green-dark); border-radius: 12px; padding: 42px;
  text-align: center; color: white;
}
.adm-panel .sec-title { color: white; font-size: 28px; margin-bottom: 10px; }
.adm-panel p { color: rgba(255,255,255,0.55); font-size: 14px; line-height: 1.8; margin-bottom: 28px; }
.adm-features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
.adm-feat {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 14px; font-size: 12px; color: rgba(255,255,255,0.7);
  font-weight: 600;
}
.adm-feat::before { display: block; font-size: 20px; margin-bottom: 5px; }
.adm-feat:nth-child(1)::before { content: '📄'; }
.adm-feat:nth-child(2)::before { content: '📋'; }
.adm-feat:nth-child(3)::before { content: '🎓'; }
.adm-feat:nth-child(4)::before { content: '💰'; }
.btn-adm {
  display: block; width: 100%; background: white; color: var(--green-dark);
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14px;
  padding: 14px; border-radius: 8px; border: none; cursor: pointer;
  text-decoration: none; text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: all 0.25s;
}
.btn-adm:hover { background: #f9f1dc; transform: translateY(-2px); }

/* ══════════════════════════════════════════
   CONTACT
══════════════════════════════════════════ */
.contact-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 40px; }
.contact-info-block {
  background: var(--green-dark); border-radius: 10px; padding: 36px;
  display: flex; flex-direction: column; gap: 22px;
}
.ci-item { display: flex; align-items: flex-start; gap: 14px; }
.ci-icon {
  width: 40px; height: 40px; min-width: 40px;

  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.ci-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }
.ci-value { font-size: 14px; font-weight: 600; color: white; margin-top: 2px; line-height: 1.5; }
.social-strip { display: flex; gap: 10px; flex-wrap: wrap; }
.social-btn {
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: white; text-decoration: none; font-size: 15px; transition: all 0.25s;
}
.social-btn:hover { background: var(--green-main); border-color: transparent; }
.contact-form-block {
  background: var(--white); border: 1px solid var(--gray-line);
  border-radius: 10px; padding: 36px;
}
.form-title { font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 26px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--gray-line); border-radius: 6px;
  background: var(--gray-bg); font-family: 'Cairo', sans-serif;
  font-size: 13.5px; color: var(--text-dark); outline: none;
  transition: all 0.25s; text-align: right;
}
.form-input:focus { border-color: var(--green-main); background: white; box-shadow: 0 0 0 3px rgba(200,16,46,0.08); }
textarea.form-input { resize: vertical; min-height: 100px; }
.form-submit {
  width: 100%; background: var(--green-dark); color: white;
  font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
  padding: 14px; border: none; border-radius: 6px; cursor: pointer;
  transition: all 0.25s; box-shadow: 0 4px 14px rgba(18,48,107,0.3);
}
.form-submit:hover { background: var(--green-main); transform: translateY(-1px); }

/* ══════════════════════════════════════════
   FOOTER  (KSU-style)
══════════════════════════════════════════ */
footer { background: var(--navy); }
.footer-main {
  max-width: 1280px; margin: 0 auto;
  padding: 60px 40px 40px;
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 50px;

}
.footer-brand-logo {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
}
.footer-logo-emb {
  width: 50px; height: 50px; background: var(--green-main); border-radius: 50%;

}
.footer-logo-name { font-size: 16px; font-weight: 700; color: white; }
.footer-logo-sub { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }
.footer-brand-desc { font-size: 13px; color: rgba(255,255,255,0.35); line-height: 1.85; max-width: 260px; margin-bottom: 24px; }
.footer-social { display: flex; gap: 8px; flex-wrap: wrap; }
.footer-social a {

.footer-col-h { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.footer-links { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer-links a { font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
.footer-links a::before { content: '‹'; color: var(--green-light); }
.footer-links a:hover { color: rgba(255,255,255,0.85); }

/* Bottom footer bar */
.footer-bottom-bar {
  max-width: 1280px; margin: 0 auto;
  padding: 22px 40px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.footer-bottom-bar .copy { font-size: 12px; color: rgba(255,255,255,0.25); }
.footer-bottom-bar .copy span { color: rgba(255,255,255,0.45); }
.footer-legal { display: flex; gap: 22px; flex-wrap: wrap; }
.footer-legal a { font-size: 12px; color: rgba(255,255,255,0.25); text-decoration: none; transition: color 0.2s; }
.footer-legal a:hover { color: rgba(255,255,255,0.6); }
.vision-badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; padding: 8px 16px;
}
.vision-text { font-size: 11px; color: rgba(255,255,255,0.35); }
.vision-year { font-size: 18px; font-weight: 900; color: var(--green-light); letter-spacing: 1px; }

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media (max-width: 1060px) {
  .hero-content, .about-grid, .contact-grid, .principal-grid, .admission-grid { grid-template-columns: 1fr; }
  .hero-accent-circle { display: none; }
  .numbers-cards { grid-template-columns: repeat(2,1fr); }
  .portals-grid { grid-template-columns: 1fr 1fr; }
  .news-grid { grid-template-columns: 1fr; }
  .mgmt-grid { grid-template-columns: repeat(2,1fr); }
  .ach-grid { grid-template-columns: repeat(2,1fr); }
  .footer-main { grid-template-columns: 1fr 1fr; }

  .quick-bar-inner { grid-template-columns: repeat(3,1fr); }
}

  .hero-content, .section, .quick-bar-inner, .footer-main, .footer-bottom-bar { padding-left: 20px; padding-right: 20px; }

.side .brand{color:#fff;font-weight:900;padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;font-size:14px;line-height:1.7}
.side a{display:block;padding:11px 18px;color:rgba(255,255,255,.8);text-decoration:none;font-weight:700;font-size:13.5px;border-right:3px solid transparent;cursor:pointer}
.side a.on,.side a:hover{background:rgba(255,255,255,.08);color:#fff;border-right-color:var(--green-main)}
.main{padding:28px;overflow:auto}.main h2{font-size:22px;font-weight:900;color:var(--green-dark);margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--gray-line);border-radius:8px;overflow:hidden;font-size:13px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--gray-line);vertical-align:top}th{background:var(--green-dark);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.st{background:#fff;border:1px solid var(--gray-line);border-radius:8px;padding:18px}.st b{display:block;font-size:28px;color:var(--green-main)}
.panel{background:#fff;border:1px solid var(--gray-line);border-radius:10px;padding:22px;margin-bottom:22px}
.panel h3{font-size:15px;font-weight:800;margin-bottom:14px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:var(--green-main)!important;border-color:var(--green-main)!important;color:#fff!important}
@media(max-width:800px){.adm{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:wrap}.side .brand{width:100%}}

<script type="module">
// طبقة ربط Firebase (Firestore + Auth + Storage). تُحمَّل فقط عند وجود إعدادات صحيحة.
const fbc=(window.MADBAQ_CONFIG||{}).firebase||{};
if(!fbc.apiKey||!fbc.projectId){ window.__sbResolve(null); }
else { try{
const V='10.12.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
const [{initializeApp},F,A]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
const app=initializeApp(fbc),db=F.getFirestore(app),auth=A.getAuth(app);
const ROLES=[{id:'admin',label:'مدير النظام'},{id:'editor',label:'محرر المحتوى'},{id:'librarian',label:'أمين المكتبة'}];
const now=()=>new Date().toISOString();
const DEF={contact_messages:()=>({is_read:false,created_at:now()}),news:()=>({created_at:now()}),educational_files:()=>({uploaded_at:now()}),gallery_albums:()=>({created_at:now()}),gallery_media:()=>({created_at:now(),sort_order:0})};
const clean=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined));
const ok=d=>({data:d,error:null}),bad=e=>({data:null,error:{message:e&&e.code==='permission-denied'?'ليست لديك صلاحية لهذه العملية':(e&&e.message)||String(e)}});
const REF={grades:'grade_id',semesters:'semester_id',subjects:'subject_id'};
class Q{
 constructor(t){this.t=t;this.f=[];this.o=null;this.op='select';this.opt={};this.single=false}
 select(c,o){this.opt=o||{};return this} eq(k,v){this.f.push([k,v]);return this}
 order(c,o){this.o=[c,!(o&&o.ascending===false)];return this} maybeSingle(){this.single=true;return this}
 insert(r){this.op='insert';this.p=r;return this} update(r){this.op='update';this.p=r;return this}
 upsert(r){this.op='upsert';this.p=r;return this} delete(){this.op='delete';return this}
 then(a,b){return this.run().then(a,b)}
 async run(){ try{
  const t=this.t; if(t==='roles') return ok(ROLES);
  const idF=this.f.find(x=>x[0]==='id'), docOf=id=>F.doc(db,t,id);
  if(this.op==='select'){
   let rows;
   if(idF){const s=await F.getDoc(docOf(idF[1]));rows=s.exists()?[{id:s.id,...s.data()}]:[]}
   else{const s=await F.getDocs(F.query(F.collection(db,t),...this.f.map(([k,v])=>F.where(k,'==',v))));rows=s.docs.map(d=>({id:d.id,...d.data()}))}
   rows=rows.filter(r=>this.f.every(([k,v])=>r[k]===v));
   if(this.o){const [c,asc]=this.o;rows.sort((a,b)=>{const x=a[c],y=b[c];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*(asc?1:-1)})}
   if(this.opt.head) return {count:rows.length,data:null,error:null};
   return ok(this.single?(rows[0]||null):rows);
  }
  if(this.op==='insert'){const d=clean({...(DEF[t]?DEF[t]():{}),...this.p});
   if(d.id){const id=d.id;delete d.id;await F.setDoc(docOf(id),d)}else await F.addDoc(F.collection(db,t),d);return ok(null)}
  if(this.op==='upsert'){for(const r of [].concat(this.p)) await F.setDoc(docOf(r.key),clean(r),{merge:true});return ok(null)}
  if(!idF) throw new Error('عملية تتطلب معرّفاً');
  if(this.op==='update'){await F.updateDoc(docOf(idF[1]),clean(this.p));return ok(null)}
  if(this.op==='delete'){
   if(REF[t]){const s=await F.getDocs(F.query(F.collection(db,'educational_files'),F.where(REF[t],'==',idF[1])));if(!s.empty) throw new Error('مرتبط بملفات موجودة')}
   if(t==='gallery_albums'){const s=await F.getDocs(F.query(F.collection(db,'gallery_media'),F.where('album_id','==',idF[1])));for(const d of s.docs) await F.deleteDoc(d.ref)}
   await F.deleteDoc(docOf(idF[1]));return ok(null)}
 }catch(e){return bad(e)} }
}
const api={
 from:t=>new Q(t),
 auth:{
  async signInWithPassword({email,password}){try{await A.signInWithEmailAndPassword(auth,email,password);return{error:null}}catch(e){return{error:e}}},
  async getSession(){await auth.authStateReady();const u=auth.currentUser;return{data:{session:u?{user:{id:u.uid}}:null}}},
  async getUser(){await auth.authStateReady();const u=auth.currentUser;return{data:{user:u?{id:u.uid}:null}}},
  signOut:()=>A.signOut(auth)},
 async seed(){ // بيانات أولية للمدير فقط، تُنشأ مرة واحدة إذا كانت المجموعات فارغة
  const empty=async t=>(await F.getDocs(F.query(F.collection(db,t),F.limit(1)))).empty;
  if(await empty('school_settings')) for(const [key,value] of Object.entries({school_name:'مدرسة الشهيد أحمد محمد المدبق للتعليم الأساسي',directorate:'إدارة شربين التعليمية',governorate:'محافظة الدقهلية — جمهورية مصر العربية',tagline:'نحو تعليم متميز، وبناء جيل واعٍ، وصناعة مستقبل أفضل.',about_text:'',vision:'',mission:'',goals:'',values:'',contact_address:'',contact_phone:'',contact_email:'',map_embed_url:''})) await F.setDoc(F.doc(db,'school_settings',key),{key,value});
  if(await empty('administrators')) for(const [full_name,job_title,sort_order] of [['الأستاذ رفيق علي عبد الهادي','مدير المدرسة',1],['الأستاذة نهى حازم','وكيلة المدرسة',2],['الأستاذة جيهان صالح','وكيلة المدرسة',3]]) await F.addDoc(F.collection(db,'administrators'),{full_name,job_title,sort_order,is_published:true,photo_path:null});
  if(await empty('semesters')) for(const [name,sort_order] of [['الفصل الدراسي الأول',1],['الفصل الدراسي الثاني',2]]) await F.addDoc(F.collection(db,'semesters'),{name,sort_order});
  if(await empty('subjects')) for(const [i,name] of ['اللغة العربية','اللغة الإنجليزية','الرياضيات','الدراسات الاجتماعية','العلوم','التربية الدينية','تكنولوجيا المعلومات'].entries()) await F.addDoc(F.collection(db,'subjects'),{name,sort_order:i+1});
 }
};
window.__sbResolve(api);
}catch(e){console.error('Firebase init failed',e);window.__sbResolve(null)} }

</script>
<script>
(async()=>{
/* لوحة الإدارة — كل العمليات تمر عبر Firebase وتحكمها سياسات RLS في الخادم، وليس هذا الملف. */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.MADBAQ_CONFIG||{};
const sb=await Promise.race([window.__sbReady,new Promise(r=>setTimeout(()=>r(null),10000))]);
if(!sb){ $('#ln').className='notice err'; $('#ln').textContent='أدخل إعدادات Firebase في MADBAQ_CONFIG أولاً، أو تعذّر الاتصال.'; return; }
let ME=null;
const FILE_EXTS=['pdf','docx','doc','pptx','ppt','jpg','png'];

const URL_OK=v=>{v=(v||'').trim(); if(!v) return ''; if(!/^https:\/\//i.test(v)||v.length>2000||/\s/.test(v)) throw new Error('الرابط غير صالح: يجب أن يبدأ بـ https:// وبدون مسافات'); return v};
const rm=()=>{};

/* ---------- الدخول ---------- */
$('#login').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  if(error){$('#ln').className='notice err';$('#ln').textContent='بيانات الدخول غير صحيحة.';return} boot()};
async function boot(){

  const {data:u}=await sb.from('users').select('full_name,role_id').eq('id',session.user.id).maybeSingle();
  if(!u){await sb.auth.signOut(); $('#ln').className='notice err'; $('#ln').textContent='هذا الحساب غير مُفعّل كمستخدم إدارة.'; return}
  ME=u; if(ME.role_id==='admin'){try{await sb.seed()}catch(e){}} $('#login').style.display='none'; $('#adm').style.display='grid'; buildSide(); go('stats');
}
const TABS=[['stats','الإحصاءات',['admin','editor','librarian']],['settings','إعدادات الموقع ومن نحن',['admin','editor']],['admins','الإدارة المدرسية',['admin','editor']],['news','الأخبار والإعلانات',['admin','editor']],['taxo','الصفوف والفصول والمواد',['admin','librarian']],['files','الملفات التعليمية',['admin','librarian']],['albums','ألبومات المعرض',['admin','editor']],['media','الصور والفيديوهات',['admin','editor']],['msgs','رسائل التواصل',['admin','editor']],['users','المستخدمون والصلاحيات',['admin']]];
function buildSide(){ $('#side').innerHTML=`<div class="brand">لوحة الإدارة<br><span style="font-weight:600;font-size:12px;opacity:.8">${esc(ME.full_name)}</span></div>`+TABS.filter(t=>t[2].includes(ME.role_id)).map(t=>`<a data-t="${t[0]}">${t[1]}</a>`).join('')+`<a id="out">تسجيل الخروج</a><a href="index.html" target="_blank">معاينة الموقع ↗</a>`;
  document.querySelectorAll('#side [data-t]').forEach(a=>a.onclick=()=>go(a.dataset.t)); $('#out').onclick=async()=>{await sb.auth.signOut();location.reload()}; }
async function go(t){ document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.t===t)); $('#main').innerHTML='<div class="empty">جارٍ التحميل…</div>'; try{await VIEWS[t]()}catch(e){$('#main').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`} }
const head=(t)=>`<h2>${t}</h2>`;
const tbl=(cols,rows)=>rows.length?`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.join('')}</table>`:'<div class="empty">لا توجد بيانات.</div>';
const q=async(p)=>{const {data,error}=await p; if(error) throw error; return data};

/* ---------- الإحصاءات الحقيقية ---------- */
const cnt=async(t,f)=>{let r=sb.from(t).select('*',{count:'exact',head:true}); if(f) r=f(r); const {count,error}=await r; if(error) throw error; return count};
const VIEWS={
async stats(){
  const v=await Promise.all([cnt('news',r=>r.eq('status','published')),cnt('news',r=>r.eq('status','draft')),cnt('educational_files'),cnt('gallery_albums'),cnt('gallery_media'),cnt('contact_messages',r=>r.eq('is_read',false))].map(p=>p.catch(()=>'—')));
  const L=['أخبار منشورة','مسودات','ملفات تعليمية','ألبومات','صور وفيديوهات','رسائل غير مقروءة'];
  $('#main').innerHTML=head('الإحصاءات')+`<div class="stats">${v.map((n,i)=>`<div class="st"><b>${n}</b>${L[i]}</div>`).join('')}</div>`;
},
/* ---------- الإعدادات ---------- */
async settings(){
  const rows=await q(sb.from('school_settings').select('*')); const s=Object.fromEntries(rows.map(r=>[r.key,r.value||'']));
  const F=[['school_name','اسم المدرسة'],['directorate','الإدارة التعليمية'],['governorate','المحافظة'],['tagline','العبارة التعريفية'],['about_text','نبذة تعريفية',1],['vision','الرؤية',1],['mission','الرسالة',1],['goals','الأهداف',1],['values','القيم التربوية والتعليمية',1],['contact_address','عنوان المدرسة (بعد التحقق منه)'],['contact_phone','الهاتف الرسمي'],['contact_email','البريد الرسمي'],['map_embed_url','رابط تضمين الخريطة (https://www.google.com/maps/embed...)']];
  $('#main').innerHTML=head('إعدادات الموقع ومن نحن')+`<form class="panel" id="sf">${F.map(([k,l,m])=>`<div class="form-group"><label class="form-label">${l}</label>${m?`<textarea class="form-input" name="${k}" rows="4">${esc(s[k])}</textarea>`:`<input class="form-input" name="${k}" value="${esc(s[k])}">`}</div>`).join('')}<button class="form-submit">حفظ</button></form>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const up=F.map(([k])=>({key:k,value:e.target[k].value,updated_at:new Date().toISOString()}));const {error}=await sb.from('school_settings').upsert(up);toast(error?error.message:'تم الحفظ',!error)};
},
/* ---------- الإدارة المدرسية ---------- */
async admins(){
  const d=await q(sb.from('administrators').select('*').order('sort_order'));
  $('#main').innerHTML=head('الإدارة المدرسية')+`<form class="panel" id="af"><h3>إضافة / تعديل</h3><input type="hidden" name="id"><div class="form-row"><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" name="full_name" required></div><div class="form-group"><label class="form-label">المسمى الوظيفي</label><input class="form-input" name="job_title" required></div></div><div class="form-row"><div class="form-group"><label class="form-label">الترتيب</label><input class="form-input" type="number" name="sort_order" value="0"></div><div class="form-group"><label class="form-label">رابط صورة رسمية (اختياري)</label><input class="form-input" type="url" name="photo" dir="ltr" placeholder="https://..."></div></div><label><input type="checkbox" name="is_published" checked> منشور</label> <button class="form-submit" style="margin-top:12px">حفظ</button></form>`+tbl(['الاسم','المسمى','الترتيب','منشور',''],d.map(a=>`<tr><td>${esc(a.full_name)}</td><td>${esc(a.job_title)}</td><td>${a.sort_order}</td><td>${a.is_published?'نعم':'لا'}</td><td class="row-actions"><button class="btn-sm alt" data-e="${a.id}">تعديل</button><button class="btn-sm danger" data-d="${a.id}">حذف</button></td></tr>`));
  const f=$('#af'); document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const a=d.find(x=>x.id===b.dataset.e);['id','full_name','job_title','sort_order'].forEach(k=>f[k].value=a[k]);f.photo.value=a.photo_path||'';f.is_published.checked=a.is_published;scrollTo(0,0)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف هذا السجل؟'))return;const a=d.find(x=>x.id===b.dataset.d);await sb.from('administrators').delete().eq('id',a.id);await rm('site',a.photo_path);go('admins')});

    const old=f.id.value?d.find(x=>x.id===f.id.value):null; row.photo_path=URL_OK(f.photo.value)||null;
    const {error}=f.id.value?await sb.from('administrators').update(row).eq('id',f.id.value):await sb.from('administrators').insert(row); if(error)throw error; toast('تم الحفظ'); go('admins')}catch(x){toast(x.message,false)}};
},
/* ---------- الأخبار ---------- */

  $('#main').innerHTML=head('الأخبار والإعلانات')+`<form class="panel" id="nf"><h3>خبر / إعلان</h3><input type="hidden" name="id"><div class="form-group"><label class="form-label">العنوان</label><input class="form-input" name="title" required></div><div class="form-row"><div class="form-group"><label class="form-label">التصنيف</label><select class="form-input" name="category"><option>خبر</option><option>إعلان</option></select></div><div class="form-group"><label class="form-label">الحالة</label><select class="form-input" name="status"><option value="draft">مسودة</option><option value="published">منشور</option><option value="hidden">مخفي</option></select></div></div><div class="form-group"><label class="form-label">الملخص</label><textarea class="form-input" name="summary" rows="2"></textarea></div><div class="form-group"><label class="form-label">المحتوى الكامل</label><textarea class="form-input" name="body" rows="8"></textarea></div><div class="form-group"><label class="form-label">رابط الصورة (اختياري)</label><input class="form-input" type="url" name="image" dir="ltr" placeholder="https://..."></div><button class="form-submit">حفظ</button></form>`+tbl(['العنوان','التصنيف','الحالة','تاريخ النشر',''],d.map(n=>`<tr><td>${esc(n.title)}</td><td>${n.category}</td><td>${{draft:'مسودة',published:'منشور',hidden:'مخفي'}[n.status]}</td><td>${n.published_at?new Date(n.published_at).toLocaleDateString('ar-EG'):'—'}</td><td class="row-actions"><button class="btn-sm alt" data-e="${n.id}">تعديل</button>${n.status==='published'?`<a class="btn-sm alt" target="_blank" href="index.html#news/${encodeURIComponent(n.slug)}">عرض</a>`:''}<button class="btn-sm danger" data-d="${n.id}">حذف</button></td></tr>`));
  const f=$('#nf'); document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const n=d.find(x=>x.id===b.dataset.e);['id','title','category','status','summary','body'].forEach(k=>f[k].value=n[k]||'');f.image.value=n.image_path||'';scrollTo(0,0)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف هذا الخبر؟'))return;const n=d.find(x=>x.id===b.dataset.d);await sb.from('news').delete().eq('id',n.id);await rm('site',n.image_path);go('news')});

    let r; if(old) r=await sb.from('news').update(row).eq('id',old.id); else {row.slug=slugify(row.title);row.created_by=(await sb.auth.getUser()).data.user.id;r=await sb.from('news').insert(row)}
    if(r.error)throw r.error; toast('تم الحفظ'); go('news')}catch(x){toast(x.message,false)}};
},
/* ---------- الصفوف والفصول والمواد ---------- */
async taxo(){
  const T=[['grades','الصفوف الدراسية'],['semesters','الفصول الدراسية'],['subjects','المواد الدراسية']]; let h=head('الصفوف والفصول والمواد');
  const data={}; for(const [t] of T) data[t]=await q(sb.from(t).select('*').order('sort_order'));
  for(const [t,l] of T) h+=`<div class="panel"><h3>${l}</h3><form class="toolbar" data-add="${t}"><input class="form-input" name="name" placeholder="الاسم" required><input class="form-input" name="sort_order" type="number" placeholder="الترتيب" style="max-width:110px"><button class="btn-sm">إضافة</button></form>${tbl(['الاسم','الترتيب',''],data[t].map(r=>`<tr><td>${esc(r.name)}</td><td>${r.sort_order}</td><td class="row-actions"><button class="btn-sm alt" data-r="${t}|${r.id}">تعديل الاسم</button><button class="btn-sm danger" data-x="${t}|${r.id}">حذف</button></td></tr>`))}</div>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-add]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from(f.dataset.add).insert({name:f.name.value.trim(),sort_order:+f.sort_order.value||0});error?toast(error.message,false):go('taxo')});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const [t,id]=b.dataset.r.split('|');const n=prompt('الاسم الجديد');if(!n)return;const {error}=await sb.from(t).update({name:n.trim()}).eq('id',id);error?toast(error.message,false):go('taxo')});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف؟'))return;const [t,id]=b.dataset.x.split('|');const {error}=await sb.from(t).delete().eq('id',id);error?toast('لا يمكن الحذف: مرتبط بملفات موجودة',false):go('taxo')});
},
/* ---------- الملفات التعليمية ---------- */
async files(){
  const [g,s,j,d]=await Promise.all([q(sb.from('grades').select('*').order('sort_order')),q(sb.from('semesters').select('*').order('sort_order')),q(sb.from('subjects').select('*').order('sort_order')),q(sb.from('educational_files').select('*').order('uploaded_at',{ascending:false}))]);
  const nm=(a,id)=>esc((a.find(x=>x.id===id)||{}).name||''); const opt=a=>a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('#main').innerHTML=head('الملفات التعليمية')+(g.length?'':'<div class="empty">أضف الصفوف الدراسية أولاً من قسم «الصفوف والفصول والمواد».</div>')+`<form class="panel" id="ff"><h3>إضافة / تعديل ملف</h3><input type="hidden" name="id"><div class="form-group"><label class="form-label">اسم الملف</label><input class="form-input" name="title" required></div><div class="form-row"><div class="form-group"><label class="form-label">الصف</label><select class="form-input" name="grade_id" required>${opt(g)}</select></div><div class="form-group"><label class="form-label">الفصل</label><select class="form-input" name="semester_id" required>${opt(s)}</select></div></div><div class="form-group"><label class="form-label">المادة</label><select class="form-input" name="subject_id" required>${opt(j)}</select></div><div class="form-group"><label class="form-label">وصف (اختياري)</label><textarea class="form-input" name="description" rows="2"></textarea></div><div class="form-group"><label class="form-label">رابط الملف (Google Drive بصلاحية «أي شخص لديه الرابط»، أو أي رابط https مباشر)</label><input class="form-input" type="url" name="file" dir="ltr" placeholder="https://drive.google.com/file/d/..." required></div><div class="form-group"><label class="form-label">نوع الملف</label><select class="form-input" name="file_ext">${FILE_EXTS.map(e=>`<option value="${e}">${e.toUpperCase()}</option>`).join('')}</select></div><label><input type="checkbox" name="is_published" checked> منشور</label> <button class="form-submit" style="margin-top:12px">حفظ</button></form>`+tbl(['الاسم','الصف','الفصل','المادة','النوع','الحجم',''],d.map(x=>`<tr><td>${esc(x.title)}</td><td>${nm(g,x.grade_id)}</td><td>${nm(s,x.semester_id)}</td><td>${nm(j,x.subject_id)}</td><td>${x.file_ext}</td><td>${x.size_bytes?Math.round(x.size_bytes/1024)+' ك.ب':'—'}</td><td class="row-actions"><button class="btn-sm alt" data-e="${x.id}">تعديل</button><button class="btn-sm danger" data-d="${x.id}">حذف</button></td></tr>`));
  const f=$('#ff'); document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=d.find(y=>y.id===b.dataset.e);['id','title','grade_id','semester_id','subject_id','description'].forEach(k=>f[k].value=x[k]||'');f.file.value=x.storage_path||'';f.file_ext.value=x.file_ext||'pdf';f.is_published.checked=x.is_published;scrollTo(0,0)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الملف نهائياً؟'))return;const x=d.find(y=>y.id===b.dataset.d);await sb.from('educational_files').delete().eq('id',x.id);await rm('library',x.storage_path);go('files')});
  f.onsubmit=async e=>{e.preventDefault();try{const old=f.id.value?d.find(y=>y.id===f.id.value):null;const url=URL_OK(f.file.value);if(!url)throw new Error('أدخل رابط الملف');
    const row={title:f.title.value.trim(),description:f.description.value.trim()||null,grade_id:f.grade_id.value,semester_id:f.semester_id.value,subject_id:f.subject_id.value,is_published:f.is_published.checked};
    row.storage_path=url;row.file_ext=f.file_ext.value;
    const r=old?await sb.from('educational_files').update(row).eq('id',old.id):await sb.from('educational_files').insert(row); if(r.error)throw r.error; toast('تم الحفظ'); go('files')}catch(x){toast(x.message,false)}};
},
/* ---------- ألبومات المعرض ---------- */
async albums(){
  const C=['مبنى المدرسة','الفصول الدراسية','مرافق المدرسة','الاحتفالات والمناسبات','الزيارات','التكريمات والجوائز'];
  const d=await q(sb.from('gallery_albums').select('*').order('created_at',{ascending:false}));
  $('#main').innerHTML=head('ألبومات المعرض')+`<form class="panel" id="gf"><input type="hidden" name="id"><div class="form-row"><div class="form-group"><label class="form-label">عنوان الألبوم</label><input class="form-input" name="title" required></div><div class="form-group"><label class="form-label">التصنيف</label><select class="form-input" name="category">${C.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="form-group"><label class="form-label">الوصف</label><textarea class="form-input" name="description" rows="2"></textarea></div><div class="form-group"><label class="form-label">رابط صورة الغلاف (اختياري)</label><input class="form-input" type="url" name="cover" dir="ltr" placeholder="https://..."></div><label><input type="checkbox" name="is_published" checked> منشور</label> <button class="form-submit" style="margin-top:12px">حفظ</button></form>`+tbl(['العنوان','التصنيف','منشور',''],d.map(a=>`<tr><td>${esc(a.title)}</td><td>${a.category}</td><td>${a.is_published?'نعم':'لا'}</td><td class="row-actions"><button class="btn-sm alt" data-e="${a.id}">تعديل</button><button class="btn-sm danger" data-d="${a.id}">حذف</button></td></tr>`));
  const f=$('#gf'); document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const a=d.find(x=>x.id===b.dataset.e);['id','title','category','description'].forEach(k=>f[k].value=a[k]||'');f.cover.value=a.cover_path||'';f.is_published.checked=a.is_published;scrollTo(0,0)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الألبوم وكل وسائطه؟'))return;const a=d.find(x=>x.id===b.dataset.d);const m=await q(sb.from('gallery_media').select('storage_path').eq('album_id',a.id));
    await sb.from('gallery_albums').delete().eq('id',a.id); go('albums')});
  f.onsubmit=async e=>{e.preventDefault();try{const old=f.id.value?d.find(x=>x.id===f.id.value):null;const row={title:f.title.value.trim(),category:f.category.value,description:f.description.value.trim()||null,is_published:f.is_published.checked};
    row.cover_path=URL_OK(f.cover.value)||null;
    const r=old?await sb.from('gallery_albums').update(row).eq('id',old.id):await sb.from('gallery_albums').insert(row);if(r.error)throw r.error;toast('تم الحفظ');go('albums')}catch(x){toast(x.message,false)}};
},
async media(){
  const al=await q(sb.from('gallery_albums').select('id,title').order('created_at',{ascending:false})); const d=await q(sb.from('gallery_media').select('*').order('created_at',{ascending:false}));
  const nm=id=>esc((al.find(a=>a.id===id)||{}).title||'');
  $('#main').innerHTML=head('الصور والفيديوهات')+(al.length?'':'<div class="empty">أنشئ ألبوماً أولاً.</div>')+`<form class="panel" id="mf"><div class="form-row"><div class="form-group"><label class="form-label">الألبوم</label><select class="form-input" name="album_id" required>${al.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">العنوان (اختياري)</label><input class="form-input" name="title"></div></div><div class="form-group"><label class="form-label">الوصف (اختياري)</label><input class="form-input" name="description"></div><div class="form-group"><label class="form-label">نوع الروابط</label><select class="form-input" name="kind"><option value="image">صور</option><option value="video">فيديوهات (يوتيوب أو Google Drive أو رابط mp4)</option></select></div><div class="form-group"><label class="form-label">الروابط — رابط في كل سطر (Google Drive بصلاحية «أي شخص لديه الرابط»، أو يوتيوب للفيديو، أو أي رابط https مباشر)</label><textarea class="form-input" name="urls" rows="5" dir="ltr" placeholder="https://..." required></textarea></div><button class="form-submit">إضافة</button></form>`+tbl(['الألبوم','النوع','العنوان',''],d.map(m=>`<tr><td>${nm(m.album_id)}</td><td>${m.kind==='video'?'فيديو':'صورة'}</td><td>${esc(m.title)}</td><td class="row-actions"><button class="btn-sm danger" data-d="${m.id}">حذف</button></td></tr>`));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف؟'))return;const m=d.find(x=>x.id===b.dataset.d);await sb.from('gallery_media').delete().eq('id',m.id);await rm('gallery',m.storage_path);go('media')});
  $('#mf').onsubmit=async e=>{e.preventDefault();const f=e.target;let ok=0;const lines=f.urls.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);for(const line of lines){try{const url=URL_OK(line);const {error}=await sb.from('gallery_media').insert({album_id:f.album_id.value,kind:f.kind.value,storage_path:url,title:f.title.value.trim()||null,description:f.description.value.trim()||null}); if(error)throw error; ok++}catch(x){toast(line.slice(0,40)+': '+x.message,false)}}
    if(ok){toast('تمت إضافة '+ok);go('media')}};
},
/* ---------- الرسائل ---------- */
async msgs(){
  const d=await q(sb.from('contact_messages').select('*').order('created_at',{ascending:false}));
  $('#main').innerHTML=head('رسائل التواصل')+tbl(['المرسل','وسيلة التواصل','العنوان','الرسالة','التاريخ',''],d.map(m=>`<tr style="${m.is_read?'':'font-weight:800;background:#fffaf0'}"><td>${esc(m.sender_name)}</td><td>${esc(m.contact_method)}</td><td>${esc(m.subject)}</td><td style="white-space:pre-wrap;max-width:320px">${esc(m.message)}</td><td>${new Date(m.created_at).toLocaleString('ar-EG')}</td><td class="row-actions"><button class="btn-sm alt" data-r="${m.id}|${m.is_read}">${m.is_read?'غير مقروء':'مقروء'}</button><button class="btn-sm danger" data-d="${m.id}">حذف</button></td></tr>`));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const [id,r]=b.dataset.r.split('|');await sb.from('contact_messages').update({is_read:r!=='true'}).eq('id',id);go('msgs')});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الرسالة؟'))return;await sb.from('contact_messages').delete().eq('id',b.dataset.d);go('msgs')});
},
/* ---------- المستخدمون ---------- */
async users(){
  const [u,r]=await Promise.all([q(sb.from('users').select('*')),q(sb.from('roles').select('*'))]);
  $('#main').innerHTML=head('المستخدمون والصلاحيات')+`<div class="panel"><h3>تفعيل مستخدم جديد</h3><p style="font-size:13px;line-height:2;color:var(--text-mid)">إنشاء حساب الدخول نفسه يتم من Firebase Console (Authentication ← Users) لأن المتصفح لا يملك صلاحية إنشاء حسابات. بعد إنشائه، انسخ «معرّف المستخدم (User UID)» وأدخله هنا لتفعيله بدور.</p><form class="toolbar" id="uf"><input class="form-input" name="id" placeholder="UUID" required><input class="form-input" name="full_name" placeholder="الاسم" required><select class="form-input" name="role_id">${r.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('')}</select><button class="btn-sm">تفعيل</button></form></div>`+tbl(['الاسم','الدور','UUID',''],u.map(x=>`<tr><td>${esc(x.full_name)}</td><td><select data-role="${x.id}" class="form-input">${r.map(o=>`<option value="${o.id}"${o.id===x.role_id?' selected':''}>${esc(o.label)}</option>`).join('')}</select></td><td style="font-size:11px">${x.id}</td><td><button class="btn-sm danger" data-d="${x.id}">إلغاء التفعيل</button></td></tr>`));
  $('#uf').onsubmit=async e=>{e.preventDefault();const f=e.target;const {error}=await sb.from('users').insert({id:f.id.value.trim(),full_name:f.full_name.value.trim(),role_id:f.role_id.value});error?toast(error.message,false):go('users')};
  document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('users').update({role_id:s.value}).eq('id',s.dataset.role);toast(error?error.message:'تم التحديث',!error)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('إلغاء تفعيل هذا المستخدم؟'))return;const {error}=await sb.from('users').delete().eq('id',b.dataset.d);error?toast(error.message,false):go('users')});
}};
boot();

})();
</script></body></html>
